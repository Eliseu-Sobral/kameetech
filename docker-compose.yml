services:
  # =============================================================================
  #  KAMEETECH LANDING — Next 16 Standalone (Portainer-ready)
  #  Usa o TRAEFIK JÁ EXISTENTE na VPS (não duplicar!)
  #  - Rede: network_public (external, mesma do traefik existente)
  #  - Certificado SSL: usa certresolver "letsencrypt" do SEU TRAEFIK existente
  # =============================================================================
  kameetech:
    build:
      context: .
      dockerfile: Dockerfile
    image: kameetech-landing:latest
    container_name: kameetech-landing
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    networks:
      - network_public
    # ── OPÇÃO B: Expõe porta DIRETO (se não quiser Traefik) ──────────────
    # ports:
    #   - "3000:3000"
    # ── HEALTHCHECK Portainer (verde / amarelo) ─────────────────────────
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # ── LABELS TRAEFIK · HTTPS + domínio automático ─────────────────────
    labels:
      - "traefik.enable=true"
      # HTTPS — Troque kameetech.com.br ← PELO SEU DOMÍNIO REAL abaixo ↓↓↓
      - "traefik.http.routers.kameetech.rule=Host(`kameetech.com.br`) || Host(`www.kameetech.com.br`)"
      - "traefik.http.routers.kameetech.entrypoints=websecure"
      # ★ SSL — aponta para o certresolver "letsencrypt" do SEU TRAEFIK JÁ RODANDO
      - "traefik.http.routers.kameetech.tls.certresolver=leresolver"
      - "traefik.http.routers.kameetech.service=kameetech-svc"
      - "traefik.http.services.kameetech-svc.loadbalancer.server.port=3000"
      - "traefik.docker.network=network_public"
      # Middleware www → non-www (opcional, comentar se não quiser)
      - "traefik.http.middlewares.kameetech-nonwww.redirectregex.regex=^https?://www\\.(.*)"
      - "traefik.http.middlewares.kameetech-nonwww.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.kameetech-nonwww.redirectregex.permanent=true"
      - "traefik.http.routers.kameetech.middlewares=kameetech-nonwww@docker,hsts-headers@docker"
      # Watchtower (se tiver rodando) — auto-atualiza com nova tag
      - "com.centurylinklabs.watchtower.enable=true"

# =============================================================================
#  REDE ÚNICA · EXISTENTE (mesma do Traefik rodando na VPS)
#  external=true OBRIGATÓRIO — evita conflito label compose/Portainer
# =============================================================================
networks:
  network_public:
    name: network_public
    external: true
