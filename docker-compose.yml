services:
  # =============================================================================
  #  KAMEETECH LANDING · Next 16 Standalone
  #  PADRÃO IDÊNTICO AO PROJETO MAMAJULA QUE JÁ FUNCIONA
  # =============================================================================
  kameetech:
    build:
      context: .
      dockerfile: Dockerfile
    image: kameetech-landing:latest
    container_name: kameetech-landing
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    networks:
      # ★ REDE CORRETA (mesma do projeto mamajula que funciona)
      - portainer_default
    # ── OPÇÃO B: Expõe porta DIRETO ──────────────────────────────────────
    # ports:
    #   - "3000:3000"
    # ── HEALTHCHECK Portainer ───────────────────────────────────────────
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # =========================================================================
    #  LABELS TRAEFIK · PADRÃO EXATO MAMAJULA
    # =========================================================================
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=portainer_default'
      # Label legada (mantida igual mamajula, usa porta INTERNA do Next standalone)
      - 'traefik.port=3000'

      # ---------- Router: kameetech.com.br ----------
      - 'traefik.http.routers.kameetech.entrypoints=websecure'
      # ★ FORMATO OBRIGATÓRIO (igual mamajula): Host(`SEU-DOMINIO`) com CRASES
      - 'traefik.http.routers.kameetech.rule=Host(`kameetech.com.br`)'
      - 'traefik.http.routers.kameetech.service=kameetech'
      # ★ TLS EXPLÍCITO (igual mamajula — faltava aqui antes)
      - 'traefik.http.routers.kameetech.tls=true'
      # ★ CERTRESOLVER CORRETO · nome real no seu Traefik (mesmo mamajula)
      - 'traefik.http.routers.kameetech.tls.certresolver=leresolver'

      # ---------- Service: kameetech ----------
      - 'traefik.http.services.kameetech.loadbalancer.server.port=3000'
      - 'traefik.http.services.kameetech.loadbalancer.server.scheme=http'
      - 'traefik.http.services.kameetech.loadbalancer.passHostHeader=true'

      # ---------------------------------------------------------------------
      #  🔒 WWW → NON-WWW (opcional). COMENTADO POR ENQUANTO (igual mamajula
      #     não usa middlewares). Descomente DEPOIS que o domínio abrir sem 404.
      # ---------------------------------------------------------------------
      # - 'traefik.http.middlewares.kameetech-nonwww.redirectregex.regex=^https?://www\.(.*)'
      # - 'traefik.http.middlewares.kameetech-nonwww.redirectregex.replacement=https://${1}'
      # - 'traefik.http.middlewares.kameetech-nonwww.redirectregex.permanent=true'
      # - 'traefik.http.routers.kameetech.middlewares=kameetech-nonwww@docker'

      # Watchtower (se tiver rodando) — auto-atualiza com nova tag
      - 'com.centurylinklabs.watchtower.enable=true'

# =============================================================================
#  REDE · MESMA DO PORTAINER / MAMAJULA (external=true, já existe)
# =============================================================================
networks:
  portainer_default:
    name: portainer_default
    external: true
